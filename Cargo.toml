[package]
name = "dungeon"
version = "0.1.0"
publish = false
authors = ["HugoPeters1024 <git@hugopeters.me>"]
edition = "2024"
exclude = ["dist", "build", "assets", "credits"]

[workspace]
members = ["mobile", "crates/bevy_editor"]

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

[lints]
workspace = true

[workspace.dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
    "std",
    "async_executor",
    "gltf_animation",
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_post_process",
    "bevy_anti_alias",
    "bevy_gilrs",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_gltf",
    "bevy_input_focus",
    "bevy_log",
    "mesh_picking",
    "bevy_pbr",
    "bevy_picking",
    "bevy_render",
    "bevy_scene",
    "bevy_image",
    "bevy_mesh",
    "bevy_camera",
    "bevy_light",
    "bevy_shader",
    "bevy_sprite",
    "sprite_picking",
    "bevy_sprite_render",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "ui_picking",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    "bevy_dev_tools",
    "custom_cursor",
    "default_font",
    "hdr",
    "ktx2",
    "multi_threaded",
    "png",
    "jpeg",
    "reflect_auto_register",
    "smaa_luts",
    "sysinfo_plugin",
    "tonemapping_luts",
    "webgpu",
    "x11",
    "wayland",
    "debug",
    "zstd_rust",
    "bevy_dev_tools",
    "serialize"
] }
bevy-inspector-egui = "0.37.0"
bevy_asset_loader = { version = "0.27.0", features = ["3d"] }
bevy_egui = { version = "0.40.1", features = ["bevy_picking"] }
bevy_panorbit_camera = { version = "0.35.0", features = [] }
egui_dock = "0.19"
rstar = "0.12.2"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

# This is used by trunk as it doesn't support custom profiles: https://github.com/trunk-rs/trunk/issues/605
# xbuild also uses this profile for building android AABs because I couldn't find a configuration for it
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Profile for distribution
[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true

[features]
dev = [
    "bevy/dynamic_linking",
]

# All of Bevy's default features exept for the audio related ones (bevy_audio, vorbis), since they clash with bevy_kira_audio
#   and android_shared_stdcxx/android-game-activity, since those are covered in `mobile`
[dependencies]
bevy = { workspace = true }
bevy_asset_loader = { workspace = true }
bevy_kira_audio = { version = "0.24", features = ["android_shared_stdcxx"] }
rand = { version = "0.9.2" }
webbrowser = { version = "1", features = ["hardened"] }
noise = "0.9"
avian3d = "0.7.0"
bevy-inspector-egui = { workspace = true }
bevy-tnua = "0.32.0"
bevy-tnua-avian3d = "0.12.1"
bevy_hanabi = {version = "0.19.0", features = ["3d"] }
bevy_editor = {path = "crates/bevy_editor" }


# keep the following in sync with Bevy's dependencies
winit = { version = "0.30", default-features = false }
image = { version = "0.25.2", default-features = false }
## This greatly improves WGPU's performance due to its heavy use of trace! calls
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }

strum = "0.27.2"
strum_macros = "0.27.2"
rstar = { workspace = true }

# Native-only dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { version = "0.3.3", features = [] }

# Wasm-only dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3.3", features = ["wasm_js"] }


[build-dependencies]
embed-resource = "1"
